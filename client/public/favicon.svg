<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#0f1923"/>
  <!-- Top-left: 10 of Hearts (red) -->
  <g transform="translate(4,4)">
    <rect width="26" height="26" rx="3" fill="#1a2734" stroke="#2d3f50" stroke-width="0.5"/>
    <text x="3" y="10" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#e74c3c">10</text>
    <text x="13" y="20" font-family="Arial,sans-serif" font-size="12" fill="#e74c3c" text-anchor="middle">&#9829;</text>
  </g>
  <!-- Top-right: 10 of Diamonds (red) -->
  <g transform="translate(34,4)">
    <rect width="26" height="26" rx="3" fill="#1a2734" stroke="#2d3f50" stroke-width="0.5"/>
    <text x="3" y="10" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#e74c3c">10</text>
    <text x="13" y="20" font-family="Arial,sans-serif" font-size="12" fill="#e74c3c" text-anchor="middle">&#9830;</text>
  </g>
  <!-- Bottom-left: 10 of Clubs (light) -->
  <g transform="translate(4,34)">
    <rect width="26" height="26" rx="3" fill="#1a2734" stroke="#2d3f50" stroke-width="0.5"/>
    <text x="3" y="10" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#e8edf2">10</text>
    <text x="13" y="20" font-family="Arial,sans-serif" font-size="12" fill="#e8edf2" text-anchor="middle">&#9827;</text>
  </g>
  <!-- Bottom-right: 10 of Spades (light) -->
  <g transform="translate(34,34)">
    <rect width="26" height="26" rx="3" fill="#1a2734" stroke="#2d3f50" stroke-width="0.5"/>
    <text x="3" y="10" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#e8edf2">10</text>
    <text x="13" y="20" font-family="Arial,sans-serif" font-size="12" fill="#e8edf2" text-anchor="middle">&#9824;</text>
  </g>
</svg>
