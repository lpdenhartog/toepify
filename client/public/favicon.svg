          fill="#F0EADD" stroke="#206848" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <g transform="rotate(17 120 205)">
    <rect x="72" y="53" width="96" height="134" rx="12" ry="12"
          fill="#F0EADD" stroke="#206848" stroke-width="8" stroke-linejoin="round"/>
  </g>
