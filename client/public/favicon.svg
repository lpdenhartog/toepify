<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Toepify">
  <!-- Green casino tile + cream fanned cards. Hardcoded #206848 ink / #F0EADD
       cream (browser chrome can't read CSS vars). Matches LogoMark + PWA icon.
       Cards live in a 240x250 space scaled 1.2 and centred in the 240 tile. -->
  <rect x="0" y="0" width="240" height="240" rx="50" ry="50" fill="#206848"/>
  <g transform="translate(-24 -30) scale(1.2)">
    <g transform="rotate(-17 120 205)">
      <rect x="72" y="53" width="96" height="134" rx="12" ry="12"
            fill="#F0EADD" stroke="#206848" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(17 120 205)">
      <rect x="72" y="53" width="96" height="134" rx="12" ry="12"
            fill="#F0EADD" stroke="#206848" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="72" y="53" width="96" height="134" rx="12" ry="12"
            fill="#F0EADD" stroke="#206848" stroke-width="5" stroke-linejoin="round"/>
      <text x="100" y="85" font-size="31.7" font-weight="700" text-anchor="middle"
            font-family="Fredoka, system-ui, sans-serif" fill="#206848">10</text>
      <text x="100" y="111" font-size="22" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif" fill="#206848">&#9824;</text>
      <text x="120" y="156" font-size="66" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif" fill="#206848">&#9824;</text>
    </g>
  </g>
</svg>
