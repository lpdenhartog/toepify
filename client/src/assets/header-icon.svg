<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70">
  <!-- 10 of Hearts (leftmost, most tilted left) -->
  <g transform="rotate(-15, 60, 70)">
    <rect x="30" y="8" width="32" height="44" rx="3" fill="#1a2734" stroke="#2d3f50" stroke-width="1"/>
    <text x="34" y="20" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#e74c3c">10</text>
    <text x="46" y="42" font-family="Arial,sans-serif" font-size="18" fill="#e74c3c" text-anchor="middle">&#9829;</text>
  </g>
  <!-- 10 of Diamonds -->
  <g transform="rotate(-5, 60, 70)">
    <rect x="40" y="8" width="32" height="44" rx="3" fill="#1a2734" stroke="#2d3f50" stroke-width="1"/>
    <text x="44" y="20" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#e74c3c">10</text>
    <text x="56" y="42" font-family="Arial,sans-serif" font-size="18" fill="#e74c3c" text-anchor="middle">&#9830;</text>
  </g>
  <!-- 10 of Clubs -->
  <g transform="rotate(5, 60, 70)">
    <rect x="50" y="8" width="32" height="44" rx="3" fill="#1a2734" stroke="#2d3f50" stroke-width="1"/>
    <text x="54" y="20" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#e8edf2">10</text>
    <text x="66" y="42" font-family="Arial,sans-serif" font-size="18" fill="#e8edf2" text-anchor="middle">&#9827;</text>
  </g>
  <!-- 10 of Spades (rightmost, most tilted right) -->
  <g transform="rotate(15, 60, 70)">
    <rect x="60" y="8" width="32" height="44" rx="3" fill="#1a2734" stroke="#2d3f50" stroke-width="1"/>
    <text x="64" y="20" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#e8edf2">10</text>
    <text x="76" y="42" font-family="Arial,sans-serif" font-size="18" fill="#e8edf2" text-anchor="middle">&#9824;</text>
  </g>
</svg>
