name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set app version env and deploy
        shell: bash
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not set." >&2
            exit 1
          fi
          if [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "RAILWAY_SERVICE_ID is not set." >&2
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          ENV_ARG=""
          if [ -n "${RAILWAY_ENVIRONMENT_ID:-}" ]; then
            ENV_ARG="--environment ${RAILWAY_ENVIRONMENT_ID}"
          fi

          railway variables set VITE_APP_VERSION="${SHORT_SHA}" \
            --service "${RAILWAY_SERVICE_ID}" \
            ${ENV_ARG} \
            --skip-deploys

          railway up \
            --service "${RAILWAY_SERVICE_ID}" \
            ${ENV_ARG} \
            --ci
